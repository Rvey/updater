<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F7F2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Updater — your open-source shipping memory</title>
    <meta name="description" content="Updater is the open-source shipping memory for coding agents. Your agent ships the code. Updater remembers why — searchable history of verified features, decisions, impact and context." />
    <meta property="og:title" content="Updater — your open-source shipping memory" />
    <meta property="og:description" content="One command connects Codex, Claude Code, Cursor, or OpenCode. Keep every verified feature with its reasoning intact." />
    <meta property="og:type" content="website" />
    <script>
      try {
        var t = localStorage.getItem("updater-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
